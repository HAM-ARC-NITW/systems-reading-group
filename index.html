<!doctype html>
<html class="latex-dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Systems Reading Group</title>

        <link rel="stylesheet" href="https://latex.vercel.app/style.min.css" />
        <style>
            html {
                zoom: 1.1;
            }

            blockquote {
                position: relative;
                margin: 2rem 0;
                padding-left: 2.75rem;
                color: hsl(0, 0%, 64%);
                font-style: italic;
            }

            blockquote::before {
                content: "\201C";
                position: absolute;
                top: 0;
                left: 0;
                color: hsl(196, 80%, 77%);
                font-style: normal;
                font-size: 2.75rem;
                line-height: 1;
            }

            blockquote cite {
                font-style: normal;
            }
        </style>
    </head>
    <body id="page-body">
        <div id="elm-app"></div>
    </body>

    <script src="./build/main.js"></script>
    <script>
        var app = Elm.Main.init({
            node: document.getElementById("elm-app"),
        });
    </script>
</html>
